name: Release distributions

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  distributions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag and version files
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG"
      - name: Build wheel and source archive
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Validate built package metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG" --dist-dir dist
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monet-plots-${{ inputs.tag }}
          path: dist/*
          if-no-files-found: error
      - name: Attach distributions to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
