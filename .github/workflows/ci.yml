name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: 1
  MPLBACKEND: Agg

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install geos proj

    - name: Check semantic version files
      run: python scripts/check_release.py

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[interactive,test]
        pip install pre-commit build

    - name: Run pre-commit
      run: |
        pre-commit run --all-files

    - name: Test with pytest (parallel)
      run: |
        pytest -n auto tests/ --cov=src/monet_plots --cov-report=xml --cov-fail-under=81

    # The gallery tooling is separate from the supported library runtimes.
    - name: Build documentation
      if: runner.os == 'Linux' && matrix.python-version == '3.12'
      run: |
        pip install -e .[docs]
        mkdocs build

    - name: Build and verify distribution
      run: |
        python -m build
        python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', glob.glob('dist/*.whl')[0]])"
        python -c "from monet_plots import spatial, SpatialFacetGridPlot, SpatialMeshPlot; from monet_plots.plot_utils import get_logo_path; from pathlib import Path; assert Path(get_logo_path()).is_file()"

  release:
    name: Prepare semantic release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check release automation credential
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "Configure RELEASE_PLEASE_TOKEN as documented in docs/releases.md."
            exit 1
          fi
      - name: Update release PR or create release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-assets:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}
