name: Conventional PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const conventional = /^(feat|fix|perf|refactor|revert|build|ci|chore|docs|style|test)(\([^\r\n()]+\))?(!)?: .+$/;
            if (!conventional.test(title)) {
              core.setFailed('Use a Conventional Commit PR title, e.g. feat(maps): add spatial facets, fix: correct map bounds, or feat!: change the plotting API. Squash merge preserves this title for release automation.');
            }
