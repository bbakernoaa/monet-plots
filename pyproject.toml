[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monet-plots"
version = "0.1.0"
authors = [
  { name="NOAA/ARL" },
]
description = "A scientific plotting library for MONET and MONETIO"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "matplotlib",
    "seaborn",
    "pandas",
    "cartopy",
    "xarray",
    "scipy",
    "numpy",
    "statsmodels",
    "dask",
    "monet-stats @ git+https://github.com/noaa-oar-arl/monet-stats@30a6b6fb816436778245cff2ad076729b46090dd",
    "flox",
]

[project.urls]
"Homepage" = "https://github.com/noaa-oar-arl/monet-plots"
"Bug Tracker" = "https://github.com/noaa-oar-arl/monet-plots/issues"

[project.optional-dependencies]
benchmark = [
    "psutil>=5.9",
]
interactive = [
    "hvplot",
    "holoviews",
    "geoviews",
    "datashader",
]
test = [
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "ruff",
]
docs = [
    "mkdocs>=1.4",
    "mkdocs-material>=8.5",
    "mkdocstrings[python]>=0.19",
    "pymdown-extensions>=9.0",
    "mkdocs-gallery>=0.10.0",
    "sphinx-gallery>=0.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"monet_plots.assets" = ["*.png"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
