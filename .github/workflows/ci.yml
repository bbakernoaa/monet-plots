name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # branches: [ main ]

env:
  PYTHONUTF8: 1

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install geos proj

    - name: Install dependencies
      run: |
        uv pip install --system -e '.[docs,interactive,test]'
        uv pip install --system pre-commit pytest-cov

    - name: Run pre-commit
      run: |
        pre-commit run --all-files

    - name: Test with pytest (parallel)
      run: |
        pytest -n auto tests/ --cov=src/monet_plots --cov-report=xml

    - name: Build documentation
      run: |
        mkdocs build
